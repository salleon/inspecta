# Builds the iPhone app and sends it to TestFlight on every push to main,
# the same pushes that build the Android app (build-apk.yml). Pushes to
# test or any other branch never start a Codemagic build, so trying out
# features costs no Codemagic minutes; a one-off build of another branch
# can still be started by hand in Codemagic.
workflows:
  ios-testflight:
    name: Inspecta iOS to TestFlight
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      # the name of the App Store Connect key in Codemagic (Team integrations > Developer Portal)
      app_store_connect: Scemo
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.com.inspecta.app
      node: 22
      xcode: latest
    scripts:
      - name: Build the web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set the build number
        script: cd ios/App && agvtool new-version -all $BUILD_NUMBER
      # the version people see (Settings, App Store) is BUILD_LABEL, the
      # same as the Android app's versionName; Apple only takes numbers and
      # dots (like 9.2), so anything else stops the build here
      - name: Set the version from BUILD_LABEL
        script: |
          VERSION=$(tr -d '[:space:]' < BUILD_LABEL)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "BUILD_LABEL is '$VERSION': the App Store needs numbers and dots, like 9.2 or 1.0.1"
            exit 1
          fi
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/" ios/App/App.xcodeproj/project.pbxproj
          grep -c "MARKETING_VERSION = $VERSION;" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
