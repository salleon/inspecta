# The iPhone apps (claude-project/SPLIT_PLAN.md, step 4). There's one Xcode
# project; scripts/ios-app.sh sets the checked-out copy up as either app
# (bundle ID, name under the icon, version from its build label) after the
# web app is built for it. iPhone only for now (no iPad).
#
# - Inspecta - EnFact (au.com.inspecta.app): to TestFlight on every push to
#   main, the same pushes that build the Android app (build-apk.yml), for
#   the owner to check things at home. Never the App Store.
# - Inspecta - Site Inspections (au.com.inspecta.site): to TestFlight only
#   when started by hand (Codemagic → Start new build → this workflow).
#
# Pushes to test or any other branch never start a build, so trying out
# features costs no Codemagic minutes; a one-off build of another branch
# can still be started by hand.

definitions:
  # the App Store Connect key in Codemagic (Team integrations > Developer Portal)
  integrations: &integrations
    app_store_connect: Scemo
  ipa_artifacts: &artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
  to_testflight: &to_testflight
    app_store_connect:
      auth: integration
      submit_to_testflight: true
  # signing, the build number and the build, the same for both apps
  scripts:
    - &use_profiles
      name: Set up signing
      script: xcode-project use-profiles
    - &build_number
      name: Set the build number
      script: cd ios/App && agvtool new-version -all $BUILD_NUMBER
    - &build_ipa
      name: Build the app
      script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    - &check_sdk
      name: Check the iOS SDK is 27 or later
      script: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-version)
        echo "Xcode: $(xcodebuild -version | head -1), iOS SDK: $SDK"
        if [ "${SDK%%.*}" -lt 27 ]; then
          echo "iOS SDK $SDK is too old: App Store Connect needs iOS 27 SDK or later (ITMS-90725). Set xcode: to 27 or later in codemagic.yaml."
          exit 1
        fi

workflows:
  ios-testflight:
    name: Inspecta - EnFact (iOS) to TestFlight
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations: *integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.com.inspecta.app
      node: 22
      # Apple only takes builds made with the iOS 27 SDK (Xcode 27) or later
      # from April 2027 (ITMS-90725). Codemagic's "latest" still meant Xcode
      # 26.x in Nov 2026, so pin 27.2 (Codemagic picks its newest 27.2 patch).
      # Move this up when a newer Xcode is out of beta on Codemagic.
      xcode: 27.2
    scripts:
      - *check_sdk
      - name: Build the web app (EnFact) and set the project up as EnFact
        script: |
          npm ci
          npm run build:enfact
          npx cap sync ios
          scripts/ios-app.sh enfact
      - *use_profiles
      - *build_number
      - *build_ipa
    artifacts: *artifacts
    publishing: *to_testflight

  ios-contractor-testflight:
    name: Inspecta - Site Inspections (iOS) to TestFlight
    max_build_duration: 60
    # no triggering: started by hand only
    integrations: *integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.com.inspecta.site
      node: 22
      # Apple only takes builds made with the iOS 27 SDK (Xcode 27) or later
      # from April 2027 (ITMS-90725). Codemagic's "latest" still meant Xcode
      # 26.x in Nov 2026, so pin 27.2 (Codemagic picks its newest 27.2 patch).
      # Move this up when a newer Xcode is out of beta on Codemagic.
      xcode: 27.2
    scripts:
      - *check_sdk
      # before signing, so the profile for au.com.inspecta.site matches
      - name: Build the web app (Contractor) and set the project up as Contractor
        script: |
          npm ci
          npm run build:contractor
          npx cap sync ios
          scripts/ios-app.sh contractor
      - *use_profiles
      - *build_number
      - *build_ipa
    artifacts: *artifacts
    publishing: *to_testflight
