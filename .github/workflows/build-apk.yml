name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (build even if a test would fail)"
        type: boolean
        default: false
      publish_to_play:
        description: "Publish to coworkers (Google Play internal testing)"
        type: boolean
        default: false
      publish_test_to_play:
        description: "Publish Inspecta Test to my phone (its own Play app, only you test it)"
        type: boolean
        default: false
      release_notes:
        description: "What's new (shown in Play; optional)"
        type: string
        default: ""
      play_encryption_key:
        description: "One-off: Play's encryption key, to export the signing key for Play (leave empty)"
        type: string
        default: ""

jobs:
  # the whole test suite first; the APK is only built if it passes —
  # unless "Skip tests" was ticked on Run workflow (pushes to main always
  # test, as they have no inputs)
  test:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install required SDK platform & build tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore
        working-directory: android/app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # Inspecta Test's own upload key (see build.gradle); skipped until the
      # TEST_KEYSTORE_BASE64 secret is set
      - name: Decode test upload keystore
        working-directory: android/app
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
        run: |
          [ -n "$TEST_KEYSTORE_BASE64" ] || exit 0
          echo "$TEST_KEYSTORE_BASE64" | base64 -d > test-upload.p12
          echo "TEST_KEYSTORE_PATH=test-upload.p12" >> "$GITHUB_ENV"

      - name: Build signed release and test APKs
        working-directory: android
        env:
          # build.gradle lives in android/app, so Gradle's file() resolves
          # this relative to that module dir — not this step's
          # working-directory — hence just "release.jks", matching where
          # the previous step decoded it (android/app/release.jks).
          RELEASE_KEYSTORE_PATH: release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          # Every CI run gets a unique, ever-increasing run number, so using
          # it as versionCode guarantees each release build can install as
          # an update over the previous one with no manual bump needed.
          CI_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleStaging bundleRelease bundleStaging --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspecta-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # "Inspecta Test": installs beside the real app with its own data
      # (see the staging build type in android/app/build.gradle)
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: inspecta-test-apk
          path: android/app/build/outputs/apk/staging/app-staging.apk

      # the same release build as an app bundle, the format Google Play
      # takes (the very first one is uploaded by hand in the Play Console)
      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: inspecta-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      # the test app as a bundle, for its own Play app "Inspecta Test"
      # (again, its very first one is uploaded by hand in the Play Console)
      - name: Upload test Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: inspecta-test-play-bundle
          path: android/app/build/outputs/bundle/staging/app-staging.aab

      # "Publish to coworkers" ticked: straight to the internal testing
      # track, and Play updates everyone's phone. versionCode is this
      # workflow's run number, so it's always higher than the last one.
      - name: Write release notes
        if: ${{ (inputs.publish_to_play || inputs.publish_test_to_play) && inputs.release_notes != '' }}
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p whatsnew
          printf '%s' "$NOTES" | head -c 500 > whatsnew/whatsnew-en-AU

      - name: Publish to Google Play (internal testing)
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.inspecta.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ inputs.release_notes != '' && 'whatsnew' || '' }}

      # "Publish Inspecta Test to my phone" ticked: the test app's internal
      # testing track, where only you are a tester. Coworkers never get it.
      - name: Publish Inspecta Test to Google Play (internal testing)
        if: ${{ inputs.publish_test_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.inspecta.app.test
          releaseFiles: android/app/build/outputs/bundle/staging/app-staging.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ inputs.release_notes != '' && 'whatsnew' || '' }}

  # One-off, for setting up Play App Signing with the key the app is
  # already signed with (so the Play version installs over the current one
  # and keeps everyone's data). Google's PEPK tool encrypts the key with
  # Play's public key; only Google can open the zip it makes. Paste the
  # encryption key the Play Console shows (hex, or the contents of
  # encryption_public_key.pem) into "play_encryption_key" on Run workflow.
  export_signing_key:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.play_encryption_key != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Export the signing key for Play
        env:
          ENCRYPTION_KEY: ${{ inputs.play_encryption_key }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -u
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          curl -sSfL -o pepk.jar https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          # the key comes as hex, or as a PEM file (whose line breaks the
          # one-line input box flattens, so it's rebuilt here)
          if printf '%s' "$ENCRYPTION_KEY" | grep -q "BEGIN PUBLIC KEY"; then
            body=$(printf '%s' "$ENCRYPTION_KEY" | sed -e 's/-----BEGIN PUBLIC KEY-----//' -e 's/-----END PUBLIC KEY-----//' | tr -d ' \r\n\t')
            { echo "-----BEGIN PUBLIC KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PUBLIC KEY-----"; } > encryption_public_key.pem
            KEYARG="--rsa-aes-encryption --encryption-key-path=encryption_public_key.pem"
          else
            KEYARG="--encryptionkey=$(printf '%s' "$ENCRYPTION_KEY" | tr -d ' \r\n\t')"
          fi
          common="--keystore=release.jks --alias=$KEY_ALIAS --output=inspecta-signing-key-for-play.zip --include-cert $KEYARG"
          # newer PEPK takes the passwords as options; older ones ask for them
          java -jar pepk.jar $common --keystore-pass="$STORE_PASS" --key-pass="$KEY_PASS" \
            || printf '%s\n%s\n' "$STORE_PASS" "$KEY_PASS" | java -jar pepk.jar $common
          rm -f release.jks
          test -s inspecta-signing-key-for-play.zip

      - name: Upload the encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: inspecta-signing-key-for-play
          path: inspecta-signing-key-for-play.zip
          retention-days: 1
