name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app:
        description: "Which app (pushes to main build EnFact)"
        type: choice
        options: [EnFact, Contractor, Both]
        default: EnFact
      skip_tests:
        description: "Skip tests (build even if a test would fail)"
        type: boolean
        default: false
      publish_to_play:
        description: "Publish to Play: EnFact to coworkers, Contractor to its internal testing (both internal testing)"
        type: boolean
        default: false
      publish_test_to_play:
        description: "Publish the test apps to my phone (EnFact Test / Site Inspections Test, their own Play apps, only you test them; always on for the test branch)"
        type: boolean
        default: false
      release_notes:
        description: "What's new (shown in Play; optional)"
        type: string
        default: ""
      play_encryption_key:
        description: "One-off: Play's encryption key, to export the signing key for Play (leave empty)"
        type: string
        default: ""
      make_contractor_key:
        description: "One-off: make the Contractor app's upload key (then add it as secrets; see README)"
        type: boolean
        default: false

jobs:
  # the whole test suite first; the APK is only built if it passes —
  # unless "Skip tests" was ticked on Run workflow (pushes to main always
  # test, as they have no inputs)
  test:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # which app(s): EnFact unless Run workflow says otherwise
      - name: Which apps
        id: apps
        env:
          APP: ${{ inputs.app || 'EnFact' }}
        run: |
          [ "$APP" = Contractor ] && echo "enfact=false" >> "$GITHUB_OUTPUT" || echo "enfact=true" >> "$GITHUB_OUTPUT"
          [ "$APP" = EnFact ] && echo "contractor=false" >> "$GITHUB_OUTPUT" || echo "contractor=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install required SDK platform & build tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore
        working-directory: android/app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # the test apps' own upload key (see build.gradle); skipped until the
      # TEST_KEYSTORE_BASE64 secret is set
      - name: Decode test upload keystore
        working-directory: android/app
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
        run: |
          [ -n "$TEST_KEYSTORE_BASE64" ] || exit 0
          echo "$TEST_KEYSTORE_BASE64" | base64 -d > test-upload.p12
          echo "TEST_KEYSTORE_PATH=test-upload.p12" >> "$GITHUB_ENV"

      # the Contractor app's own upload key (see build.gradle); without the
      # CONTRACTOR_KEYSTORE_BASE64 secret its release is left unsigned
      - name: Decode Contractor upload keystore
        if: ${{ steps.apps.outputs.contractor == 'true' }}
        working-directory: android/app
        env:
          CONTRACTOR_KEYSTORE_BASE64: ${{ secrets.CONTRACTOR_KEYSTORE_BASE64 }}
        run: |
          [ -n "$CONTRACTOR_KEYSTORE_BASE64" ] || { echo "::warning title=Contractor app not signed::No CONTRACTOR_KEYSTORE_BASE64 secret, so its release APK and bundle are unsigned (fine to look at, not for Play)"; exit 0; }
          echo "$CONTRACTOR_KEYSTORE_BASE64" | base64 -d > contractor-upload.p12
          echo "CONTRACTOR_KEYSTORE_PATH=contractor-upload.p12" >> "$GITHUB_ENV"

      # Each app is its own web build copied into the Android project, then
      # its Gradle flavor (android/app/build.gradle). Signing reads these:
      # build.gradle lives in android/app, so Gradle's file() resolves the
      # keystore paths relative to that module dir (where they were decoded).
      # Every CI run gets a unique, ever-increasing run number, so using it
      # as versionCode lets each build install as an update over the last.
      - name: Build Inspecta - EnFact (release and test APKs, Play bundles)
        if: ${{ steps.apps.outputs.enfact == 'true' }}
        env:
          RELEASE_KEYSTORE_PATH: release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          CI_VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run build:enfact
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleEnfactRelease assembleEnfactStaging bundleEnfactRelease bundleEnfactStaging --no-daemon

      - name: Build Inspecta - Site Inspections (release and test APKs, Play bundles)
        if: ${{ steps.apps.outputs.contractor == 'true' }}
        env:
          RELEASE_KEYSTORE_PATH: release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          CONTRACTOR_KEYSTORE_PASSWORD: ${{ secrets.CONTRACTOR_KEYSTORE_PASSWORD }}
          CI_VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run build:contractor
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleContractorRelease assembleContractorStaging bundleContractorRelease bundleContractorStaging --no-daemon

      # EnFact: the app coworkers install, and "EnFact Test" (installs beside
      # it with its own data, orange icon), each also as the bundle Play takes
      - name: Upload EnFact APK
        if: ${{ steps.apps.outputs.enfact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: enfact-apk
          path: android/app/build/outputs/apk/enfact/release/*.apk

      - name: Upload EnFact Test APK
        if: ${{ steps.apps.outputs.enfact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: enfact-test-apk
          path: android/app/build/outputs/apk/enfact/staging/*.apk

      - name: Upload EnFact Play bundle
        if: ${{ steps.apps.outputs.enfact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: enfact-play-bundle
          path: android/app/build/outputs/bundle/enfactRelease/*.aab

      - name: Upload EnFact Test Play bundle
        if: ${{ steps.apps.outputs.enfact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: enfact-test-play-bundle
          path: android/app/build/outputs/bundle/enfactStaging/*.aab

      # Contractor: Inspecta - Site Inspections and its test app (installs
      # beside it with its own data, orange icon), each also as the bundle
      # its own Play app takes (the very first of each uploaded by hand in
      # the Play Console)
      - name: Upload Contractor APK
        if: ${{ steps.apps.outputs.contractor == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: contractor-apk
          path: android/app/build/outputs/apk/contractor/release/*.apk

      - name: Upload Contractor Test APK
        if: ${{ steps.apps.outputs.contractor == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: contractor-test-apk
          path: android/app/build/outputs/apk/contractor/staging/*.apk

      - name: Upload Contractor Play bundle
        if: ${{ steps.apps.outputs.contractor == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: contractor-play-bundle
          path: android/app/build/outputs/bundle/contractorRelease/*.aab

      - name: Upload Contractor Test Play bundle
        if: ${{ steps.apps.outputs.contractor == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: contractor-test-play-bundle
          path: android/app/build/outputs/bundle/contractorStaging/*.aab

      # "Publish to coworkers" ticked: straight to the internal testing
      # track, and Play updates everyone's phone. versionCode is this
      # workflow's run number, so it's always higher than the last one.
      - name: Write release notes
        if: ${{ (inputs.publish_to_play || inputs.publish_test_to_play || github.ref_name == 'test') && inputs.release_notes != '' }}
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p whatsnew
          printf '%s' "$NOTES" | head -c 500 > whatsnew/whatsnew-en-AU

      - name: Publish EnFact to Google Play (internal testing)
        if: ${{ inputs.publish_to_play && steps.apps.outputs.enfact == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.inspecta.app
          releaseFiles: android/app/build/outputs/bundle/enfactRelease/app-enfact-release.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ inputs.release_notes != '' && 'whatsnew' || '' }}

      # "Publish EnFact Test to my phone" ticked, or any build of the test
      # branch: the test app's internal testing track, where only you are a
      # tester. Coworkers never get it.
      - name: Publish EnFact Test to Google Play (internal testing)
        if: ${{ (inputs.publish_test_to_play || github.ref_name == 'test') && steps.apps.outputs.enfact == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.inspecta.app.test
          releaseFiles: android/app/build/outputs/bundle/enfactStaging/app-enfact-staging.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ inputs.release_notes != '' && 'whatsnew' || '' }}

      # Contractor, "Publish to Play" ticked: its own Play app's internal
      # testing track for now (production comes with the store listing,
      # step 6 of claude-project/SPLIT_PLAN.md). Needs its upload key.
      - name: Publish Inspecta - Site Inspections to Google Play (internal testing)
        if: ${{ inputs.publish_to_play && steps.apps.outputs.contractor == 'true' }}
        env:
          SIGNED: ${{ env.CONTRACTOR_KEYSTORE_PATH }}
        run: |
          [ -n "$SIGNED" ] || { echo "::error title=Contractor app not signed::Add the CONTRACTOR_KEYSTORE_BASE64 and CONTRACTOR_KEYSTORE_PASSWORD secrets first (README: Two Android apps)"; exit 1; }

      - name: Upload Inspecta - Site Inspections to Google Play
        if: ${{ inputs.publish_to_play && steps.apps.outputs.contractor == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.inspecta.site
          releaseFiles: android/app/build/outputs/bundle/contractorRelease/app-contractor-release.aab
          track: internal
          status: completed
          # no "What's new" for the Contractor apps yet: it's written as
          # en-AU (EnFact's language) and their Play apps are en-US

      # "Publish the test apps to my phone" ticked, or any build of the test
      # branch: Site Inspections Test's internal testing track, where only
      # you are a tester (like EnFact Test above)
      - name: Publish Inspecta - Site Inspections Test to Google Play (internal testing)
        if: ${{ (inputs.publish_test_to_play || github.ref_name == 'test') && steps.apps.outputs.contractor == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.com.inspecta.site.test
          releaseFiles: android/app/build/outputs/bundle/contractorStaging/app-contractor-staging.aab
          track: internal
          status: completed

  # One-off, for setting up Play App Signing with the key the app is
  # already signed with (so the Play version installs over the current one
  # and keeps everyone's data). Google's PEPK tool encrypts the key with
  # Play's public key; only Google can open the zip it makes. Paste the
  # encryption key the Play Console shows (hex, or the contents of
  # encryption_public_key.pem) into "play_encryption_key" on Run workflow.
  export_signing_key:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.play_encryption_key != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Export the signing key for Play
        env:
          ENCRYPTION_KEY: ${{ inputs.play_encryption_key }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -u
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          curl -sSfL -o pepk.jar https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          # the key comes as hex, or as a PEM file (whose line breaks the
          # one-line input box flattens, so it's rebuilt here)
          if printf '%s' "$ENCRYPTION_KEY" | grep -q "BEGIN PUBLIC KEY"; then
            body=$(printf '%s' "$ENCRYPTION_KEY" | sed -e 's/-----BEGIN PUBLIC KEY-----//' -e 's/-----END PUBLIC KEY-----//' | tr -d ' \r\n\t')
            { echo "-----BEGIN PUBLIC KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PUBLIC KEY-----"; } > encryption_public_key.pem
            KEYARG="--rsa-aes-encryption --encryption-key-path=encryption_public_key.pem"
          else
            KEYARG="--encryptionkey=$(printf '%s' "$ENCRYPTION_KEY" | tr -d ' \r\n\t')"
          fi
          common="--keystore=release.jks --alias=$KEY_ALIAS --output=inspecta-signing-key-for-play.zip --include-cert $KEYARG"
          # newer PEPK takes the passwords as options; older ones ask for them
          java -jar pepk.jar $common --keystore-pass="$STORE_PASS" --key-pass="$KEY_PASS" \
            || printf '%s\n%s\n' "$STORE_PASS" "$KEY_PASS" | java -jar pepk.jar $common
          rm -f release.jks
          test -s inspecta-signing-key-for-play.zip

      - name: Upload the encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: inspecta-signing-key-for-play
          path: inspecta-signing-key-for-play.zip
          retention-days: 1

  # One-off: makes the Contractor app's upload key (a PKCS12 keystore,
  # alias inspecta-site, with a random password) and hands it over as a
  # short-lived artifact. Add its two files as the CONTRACTOR_KEYSTORE_BASE64
  # and CONTRACTOR_KEYSTORE_PASSWORD secrets, keep a copy somewhere safe,
  # then delete the artifact. Run it once: a new key means a new upload key
  # to register with Play.
  make_contractor_key:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_contractor_key }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make the key
        run: |
          set -eu
          mkdir key && cd key
          PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)
          keytool -genkeypair -storetype PKCS12 -keystore contractor-upload.p12 -alias inspecta-site \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Inspecta - Site Inspections, C=AU"
          base64 -w0 contractor-upload.p12 > CONTRACTOR_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > CONTRACTOR_KEYSTORE_PASSWORD.txt
          printf '%s\n' "Add each .txt file's contents as a GitHub Actions secret of the same name" \
            "(Settings > Secrets and variables > Actions). Keep contractor-upload.p12 and the" \
            "password somewhere safe, then delete this artifact." > README.txt

      - name: Upload the key
        uses: actions/upload-artifact@v4
        with:
          name: contractor-upload-key
          path: key/
          retention-days: 1
