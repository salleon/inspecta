name: Website

# Publishes site/ (the home page and privacy policy, for the Play Store and
# App Store listings) to GitHub Pages: https://salleon.github.io/inspecta/
# Runs when site/ changes on main, or by hand. Needs Settings > Pages >
# Source set to "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths: ["site/**", "public/icon-192.png", "public/favicon.svg", "public/apple-touch-icon.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the app's own icons, so they stay the same as the app's
      - name: Add the icons
        run: cp public/icon-192.png public/favicon.svg public/apple-touch-icon.png site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
