name: Tests

# Runs on every push, and before every APK build (build-apk.yml calls it),
# so a broken change is caught before anyone installs it.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: the Playwright browser install fails on the Ubuntu 26 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # unit tests, then a production build, then the browser tests
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # each failing test as an annotation, so it shows on the run's summary
      - name: Show failing tests
        if: failure()
        run: |
          grep -n -E "^not ok|^ *not ok" test-output.txt | head -20 | while IFS= read -r line; do
            n=${line%%:*}
            detail=$(sed -n "$((n+1)),$((n+25))p" test-output.txt | grep -E "error:|message|expected|actual|Error" | head -4 | tr '\n' ' ')
            echo "::error title=Test failed::${line#*:} ${detail}"
          done
