name: Tests

# Runs on every push, and before every APK build (build-apk.yml calls it),
# so a broken change is caught before anyone installs it.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # unit tests, then a production build, then the browser tests
      - name: Run tests
        run: npm test
