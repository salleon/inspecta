name: Build iOS

# Checks the iPhone app compiles (simulator build, no signing). Only runs
# when the iPhone project itself changes (the Swift code, Xcode project or
# this file), not on everyday app changes in src/, so feature work on the
# test branch doesn't start iOS builds. The real iPhone build, for
# TestFlight, is Codemagic's, on pushes to main (codemagic.yaml).
on:
  push:
    branches: [main, test, ios]
    paths: ["ios/**", "scripts/ios-app.sh", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the Contractor app (Inspecta - Site Inspections), set up the way
      # codemagic.yaml does, so scripts/ios-app.sh is checked on a Mac too;
      # EnFact's setup differs only in its ID, name and version
      - run: npm run build:contractor

      - run: npx cap sync ios

      - run: scripts/ios-app.sh contractor

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -40

      # each compile error as an annotation, so it shows on the run's summary
      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:|error :" build.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=iOS build::${line}"
          done
