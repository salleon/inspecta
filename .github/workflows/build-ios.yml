name: Build iOS

# Checks the iPhone app compiles (simulator build, no signing).
on:
  push:
    branches: [main, test, ios]
    paths: ["ios/**", "src/**", "package*.json", "capacitor.config.ts", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx cap sync ios

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -40

      # each compile error as an annotation, so it shows on the run's summary
      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:|error :" build.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=iOS build::${line}"
          done
