apply plugin: 'com.android.application'

android {
    namespace = "au.com.inspecta.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.com.inspecta.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is auto-bumped by CI from the GitHub Actions run number
        // (see .github/workflows/build-apk.yml), so every release build is a
        // higher code than the last and Android will offer it as an update.
        // Locally (no CI_VERSION_CODE set) it just falls back to 1.
        // (the brackets matter: `versionCode (x) ?: 1` is versionCode(x), so
        // a local build without CI_VERSION_CODE had none and couldn't bundle)
        versionCode((System.getenv("CI_VERSION_CODE") ?: "1") as Integer)
        // versionName: each app's own build label (BUILD_LABEL_ENFACT /
        // BUILD_LABEL_CONTRACTOR), set by its flavor below
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing reads from environment variables rather than a
    // committed file, so the real keystore/passwords never touch the repo.
    // CI (see .github/workflows/build-apk.yml) sets these from GitHub
    // Actions secrets before invoking gradle; a signingConfig is only wired
    // up when they're actually present, so a plain local `assembleDebug`
    // (which doesn't need signing) still works with nothing configured.
    def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    def releaseKeystorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

    // Inspecta Test has its own upload key for its own Play app: Play won't
    // take the real app's key there (it signs what Play delivers). Without
    // it, the test app is signed like the release.
    def testKeystorePath = System.getenv("TEST_KEYSTORE_PATH")
    def testKeystorePassword = System.getenv("TEST_KEYSTORE_PASSWORD")
    def hasTestSigning = testKeystorePath && testKeystorePassword

    // Inspecta - Site Inspections (the contractor flavor) has its own
    // upload key for its own Play app, as Play won't take another app's.
    // Without it, the Contractor release isn't signed at all (an unsigned
    // APK and bundle), so it can't go to Play by mistake with EnFact's key.
    def contractorKeystorePath = System.getenv("CONTRACTOR_KEYSTORE_PATH")
    def contractorKeystorePassword = System.getenv("CONTRACTOR_KEYSTORE_PASSWORD")
    def hasContractorSigning = contractorKeystorePath && contractorKeystorePassword

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        if (hasTestSigning) {
            staging {
                storeFile file(testKeystorePath)
                storePassword testKeystorePassword
                keyAlias "inspecta-test"
                keyPassword testKeystorePassword
            }
        }
        if (hasContractorSigning) {
            contractor {
                storeFile file(contractorKeystorePath)
                storePassword contractorKeystorePassword
                keyAlias "inspecta-site"
                keyPassword contractorKeystorePassword
            }
        }
    }

    // The two apps (claude-project/SPLIT_PLAN.md), each built from its own
    // copy of the web app (npm run build:enfact / build:contractor, then
    // npx cap sync android). Names come from src/<flavor>/res, the test
    // builds' from src/<flavor>Staging/res. Each signs its release with its
    // own key; a build type's signing (staging's test key) comes first.
    flavorDimensions = ["app"]
    productFlavors {
        // Inspecta - EnFact: EnFact's staff, Play internal testing. Keeps
        // the original app ID, so phones update in place with their data.
        enfact {
            dimension "app"
            applicationId "au.com.inspecta.app"
            versionName rootProject.file("../BUILD_LABEL_ENFACT").text.trim()
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        // Inspecta - Site Inspections: other companies, public on Play
        contractor {
            dimension "app"
            applicationId "au.com.inspecta.site"
            versionName rootProject.file("../BUILD_LABEL_CONTRACTOR").text.trim()
            if (hasContractorSigning) {
                signingConfig signingConfigs.contractor
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // signed by the app's own key (its flavor, above)
        }
        // Test builds ("EnFact Test", "Inspecta Test"): the same app with
        // its own ID (.test), so it installs beside the real one instead of
        // over it, and keeps its own sites and findings. The orange icon
        // background comes from src/staging/res, the name from
        // src/<flavor>Staging/res. Built by CI next to the release APK.
        // Without the test key, signed like that app's release.
        staging {
            initWith release
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            // Capacitor's library modules only have debug/release
            matchingFallbacks = ['release']
            if (hasTestSigning) {
                signingConfig signingConfigs.staging
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // the camera (NativeCameraPlugin): Android's own camera system
    def camerax_version = "1.6.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
