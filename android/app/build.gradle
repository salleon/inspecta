apply plugin: 'com.android.application'

android {
    namespace = "au.com.inspecta.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.com.inspecta.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is auto-bumped by CI from the GitHub Actions run number
        // (see .github/workflows/build-apk.yml), so every release build is a
        // higher code than the last and Android will offer it as an update.
        // Locally (no CI_VERSION_CODE set) it just falls back to 1.
        versionCode (System.getenv("CI_VERSION_CODE") as Integer) ?: 1
        // versionName is the build label handed out to the team, read from
        // BUILD_LABEL at the repo root (also shown in the app's Settings).
        // Changed by hand only when a build is given out.
        versionName rootProject.file("../BUILD_LABEL").text.trim()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing reads from environment variables rather than a
    // committed file, so the real keystore/passwords never touch the repo.
    // CI (see .github/workflows/build-apk.yml) sets these from GitHub
    // Actions secrets before invoking gradle; a signingConfig is only wired
    // up when they're actually present, so a plain local `assembleDebug`
    // (which doesn't need signing) still works with nothing configured.
    def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    def releaseKeystorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        // Test build ("Inspecta Test"): the same app with its own ID, so it
        // installs beside the real Inspecta instead of over it, and keeps
        // its own sites and findings. Its name and orange icon background
        // come from src/staging/res. Built by CI next to the release APK.
        staging {
            initWith release
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            // Capacitor's library modules only have debug/release
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
